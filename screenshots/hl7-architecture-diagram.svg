  <rect x="420" y="110" width="360" height="40" rx="10" fill="#1e293b"/>
  <text x="445" y="136" fill="#ffffff" font-family="'Inter', sans-serif" font-size="15" font-weight="800">Healthcare Integration Gateway</text>

