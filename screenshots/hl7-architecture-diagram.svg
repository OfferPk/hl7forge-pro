<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b13"/>
      <stop offset="100%" stop-color="#0d1522"/>
    </linearGradient>
    <linearGradient id="gwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131f32"/>
      <stop offset="100%" stop-color="#0a111c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="50" y="50" fill="#ffffff" font-family="'Inter', sans-serif" font-size="20" font-weight="800">Healthcare Interoperability &amp; HL7/FHIR Zero-Trust Architecture</text>
  <text x="50" y="75" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">HL7 v2.x ER7 to FHIR R4 Pipeline, SMART on FHIR Security &amp; HIPAA / IHE ATNA Compliance</text>

  <!-- Left Column: Clinical EHR Systems -->
  <rect x="50" y="130" width="250" height="490" rx="8" fill="#101c2e" stroke="#1c2b42" stroke-width="1.5"/>
  <rect x="50" y="130" width="250" height="36" rx="8" fill="#1e293b"/>
  <text x="70" y="154" fill="#10b981" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Clinical EHR Core (VLAN 100)</text>

  <rect x="70" y="185" width="210" height="70" rx="6" fill="#0a111c" stroke="#1c2b42"/>
  <text x="85" y="210" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Epic EHR Server</text>
  <text x="85" y="235" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">EPIC_EHR (192.168.1.40)</text>

  <rect x="70" y="275" width="210" height="70" rx="6" fill="#0a111c" stroke="#1c2b42"/>
  <text x="85" y="300" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Cerner Millennium LIS</text>
  <text x="85" y="325" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">LAB_SYS (192.168.1.41)</text>

  <rect x="70" y="365" width="210" height="70" rx="6" fill="#0a111c" stroke="#1c2b42"/>
  <text x="85" y="390" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Clinical Protocols</text>
  <text x="85" y="415" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">ADT^A01, ORM^O01, ORU^R01</text>

  <rect x="70" y="455" width="210" height="70" rx="6" fill="#0a111c" stroke="#1c2b42"/>
  <text x="85" y="480" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Transport Framing</text>
  <text x="85" y="505" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="11">MLLP &lt;VT&gt;...&lt;FS&gt;&lt;CR&gt;</text>

  <rect x="70" y="540" width="210" height="60" rx="6" fill="#0a111c" stroke="#10b981" stroke-width="1.5"/>
  <text x="85" y="565" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">mTLS 1.3 Client Certs</text>
  <text x="85" y="585" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">X.509 PKI Authenticated</text>

  <!-- Physical Link -->
  <line x1="300" y1="360" x2="420" y2="360" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4"/>
  <rect x="315" y="335" width="90" height="24" rx="4" fill="#0a111c" stroke="#10b981"/>
  <text x="323" y="351" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">TCP 2575 MLLP</text>

