  <rect x="445" y="170" width="310" height="70" rx="6" fill="#0a111c" stroke="#1c2b42"/>
  <text x="460" y="195" fill="#10b981" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Linux nftables Clinical Firewall</text>
  <text x="460" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Rate Limit MLLP Port 2575 | Drop Plaintext Streams</text>
  <text x="460" y="230" fill="#06b6d4" font-family="'Inter', sans-serif" font-size="11">Block Traffic from Guest VLAN 500</text>

