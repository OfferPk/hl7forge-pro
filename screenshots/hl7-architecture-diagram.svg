  <text x="460" y="300" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11">Map ADT to Patient | Map ORU to Observation</text>
  <text x="460" y="318" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11">LOINC &amp; SNOMED CT Terminology Harmonization</text>

  <rect x="445" y="345" width="310" height="75" rx="6" fill="#0a111c" stroke="#1c2b42"/>
  <text x="460" y="370" fill="#10b981" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Suricata Layer 7 Threat Signatures</text>
  <text x="460" y="390" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="11">Detect Malformed MSH Header Fuzzing</text>
  <text x="460" y="408" fill="#ef4444" font-family="'Inter', sans-serif" font-size="11">Block Code Injection in OBX-5 Clinical Data</text>

  <rect x="445" y="435" width="310" height="85" rx="6" fill="#0a111c" stroke="#10b981" stroke-width="1.5"/>
  <text x="460" y="460" fill="#10b981" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SMART on FHIR OAuth 2.0 &amp; OIDC</text>
  <text x="460" y="480" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11">Granular Scopes: patient/Observation.read</text>
  <text x="460" y="500" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11">Asymmetric JWT Token Verification (RS256)</text>

  <rect x="445" y="535" width="310" height="85" rx="6" fill="#0a111c" stroke="#1c2b42"/>
  <text x="460" y="560" fill="#10b981" font-family="'Inter', sans-serif" font-size="12" font-weight="700">IHE ATNA RFC 3881 Syslog Emitter</text>
  <text x="460" y="580" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Full Audit Trail: Receipt, Mapping, Dispatch</text>
  <text x="460" y="600" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">TLS Syslog Forwarding to Hospital SOC</text>

  <!-- Right Column: Downstream Healthcare Consumers -->
  <line x1="780" y1="210" x2="880" y2="210" stroke="#10b981" stroke-width="2"/>
  <rect x="880" y="160" width="270" height="90" rx="8" fill="#101c2e" stroke="#1c2b42"/>
  <text x="900" y="188" fill="#10b981" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Regional Health Exchange (HIE)</text>
  <text x="900" y="210" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Cross-Hospital Patient History</text>
  <text x="900" y="230" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11">UAE Malaffi / US State HIE</text>

  <line x1="780" y1="360" x2="880" y2="360" stroke="#06b6d4" stroke-width="2"/>
  <rect x="880" y="310" width="270" height="90" rx="8" fill="#101c2e" stroke="#1c2b42"/>
  <text x="900" y="338" fill="#06b6d4" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Clinical AI &amp; Analytics Cloud</text>
  <text x="900" y="360" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Real-Time Sepsis &amp; Vitals Prediction</text>
  <text x="900" y="380" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11">FHIR R4 Streaming Ingestion</text>

  <line x1="780" y1="510" x2="880" y2="510" stroke="#ef4444" stroke-width="2"/>
  <rect x="880" y="460" width="270" height="90" rx="8" fill="#101c2e" stroke="#1c2b42"/>
  <text x="900" y="488" fill="#ef4444" font-family="'Inter', sans-serif" font-size="13" font-weight="700">VLAN 500: Guest / Admin Network</text>
  <text x="900" y="510" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Quarantined General Hospital Devices</text>
  <text x="900" y="530" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11">Zero Route to Clinical VLAN 100</text>
</svg>